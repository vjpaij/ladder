name: Nightly Asset Metadata & Benchmark Sync (Manual)

on:
  # CRON DISABLED (Rule 20 - Dual-Execution Ban):
  # The local Express daemon handles nightly self-healing and metadata sync.
  # Re-enable only if the local daemon is not running (quota quarantine mode).
  # schedule:
  #   - cron: '30 17 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache Dependencies
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - name: Synchronize Stock Market Caps & Sectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync_asset_metadata.mjs

      - name: Synchronize Benchmark Indices Daily History
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync_index_history.mjs

