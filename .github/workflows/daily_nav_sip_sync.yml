name: Hourly NAV & SIP Cloud Sync

on:
  schedule:
    # Trading-day guard is enforced inside sync_navs_and_sips.mjs itself.
    # This workflow fires on schedule — the script exits early on weekends/holidays.
    #
    # NAV declaration windows (IST):
    # Evening window: 21:07, 22:07, 23:07, 23:37  (Protean usually publishes by 21:00-22:30 IST)
    # Catch-up morning window: 09:07, 10:07        (picks up any schemes missed from the prior night)
    #
    # UTC times (IST - 5:30):
    # Evening:  15:37, 16:37, 17:37, 18:07  UTC
    # Morning:  03:37, 04:37                UTC
    - cron: '37 3,4,15,16,17 * * *'
    - cron: '7 18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache Dependencies
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - name: Execute NAV Sync & SIP Processing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync_navs_and_sips.mjs
