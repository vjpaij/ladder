name: NAV & SIP Cloud Sync (Manual)

on:
  # CRON DISABLED (Rule 20 - Dual-Execution Ban):
  # The local Express daemon processes SIPs every 15 min and syncAllMissingNavs on boot.
  # Re-enable only if the local daemon is not running (quota quarantine mode).
  # schedule:
  #   - cron: '37 3,4,15,16,17 * * *'
  #   - cron: '7 18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache Dependencies
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - name: Execute Daily Sync (NAV Backfill & SIP Processing)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/daily_sync.mjs

