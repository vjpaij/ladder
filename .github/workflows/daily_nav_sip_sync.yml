name: Hourly NAV & SIP Cloud Sync

on:
  schedule:
    # Runs hourly during NAV declaration windows only (IST 21:00-00:00 and 09:00-12:00)
    # Use a non-round minute to reduce GitHub Actions queue delays.
    # UTC 15:37, 16:37, 17:37, 18:37 = IST 21:07, 22:07, 23:07, 00:07
    # UTC 03:37, 04:37, 05:37, 06:37 = IST 09:07, 10:07, 11:07, 12:07
    - cron: '37 3,4,5,6,15,16,17,18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache Dependencies
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - name: Execute Daily Scrapers & Catch-Up Sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync_navs_and_sips.mjs
