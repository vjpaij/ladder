name: Hourly NAV & SIP Cloud Sync

on:
  schedule:
    # Runs hourly during NAV declaration windows only (IST 21:00-00:00 and 09:00-12:00)
    # UTC 15:30, 16:30, 17:30, 18:30 = IST 21:00, 22:00, 23:00, 00:00
    # UTC 03:30, 04:30, 05:30, 06:30 = IST 09:00, 10:00, 11:00, 12:00
    - cron: '30 3,4,5,6,15,16,17,18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm install axios adm-zip @supabase/supabase-js dotenv

      - name: Execute Daily Scrapers & Catch-Up Sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync_navs_and_sips.mjs
