name: Daily Portfolio EOD Sync

on:
  # CRON DISABLED (Rule 20 - Dual-Execution Ban):
  # The local Express daemon runs EOD rebuild at 06:30 PM IST and 07:00 AM IST.
  # Re-enable only if the local daemon is not running (quota quarantine mode).
  # push:
  #   branches: [main]
  #   paths:
  #     - '.github/workflows/daily_eod_sync.yml'
  #     - 'scripts/load_historical_prices.mjs'
  #     - 'scripts/rebuild_portfolio_eod.mjs'
  # schedule:
  #   - cron: '45 23 * * *'
  workflow_dispatch:


jobs:
  sync-eod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Refresh Historical Market Prices and NAVs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/load_historical_prices.mjs

      - name: Rebuild and Persist Daily EOD Logs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/rebuild_portfolio_eod.mjs